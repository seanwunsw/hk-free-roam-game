[/Script/EngineSettings.GameMapsSettings]
; HKWorld does not exist until the bake runs. The bake rewrites these two lines.
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/HKFreeRoam.HKFreeRoamGameMode
GameInstanceClass=/Script/HKFreeRoam.HKGameInstance

[/Script/Engine.RendererSettings]
r.ReflectionMethod=1
r.DynamicGlobalIlluminationMethod=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.Lumen.HardwareRayTracing=False
; Global Distance Field traces only. 1 is detail tracing against each mesh SDF. Lumen's own
; notes call that path very expensive on large merged meshes, and these tiles are 250 m merges.
; A project setting outranks scalability, so a quality level will not turn this back on.
; The console still can: r.Lumen.TraceMeshSDFs 1
r.Lumen.TraceMeshSDFs=0
r.GenerateMeshDistanceFields=True
; Engine default. Raising it rebuilds every mesh distance field, and the memory cost climbs
; quickly. The bake already sets each tile's DistanceFieldResolutionScale to 0.25.
r.DistanceFields.DefaultVoxelDensity=0.200000
r.DefaultFeature.AutoExposure=True
; UE 5.8: keep the legacy (non-Substrate) material path on purpose. The bake builds every material in
; C++ against the legacy pins (figure = Subsurface + rim emissive, outline = Unlit, MakeCustomMaterial
; facade/road/water/terrain), and 5.8 already keeps upgraded projects off Substrate; this line makes
; that explicit so a template or editor default can't flip it. Substrate is a one-way per-asset change;
; try it on a branch, never here.
r.Substrate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
