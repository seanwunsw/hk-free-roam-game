; Levels: 0 Low, 1 Medium, 2 High (the playable default), 3 Epic, Cine.
; A key here overrides the same key in Engine/Config/BaseScalability.ini. Every other key
; stays on the engine curve. sg.ResolutionQuality is a screen percentage, not a 0-3 index,
; and this file does not set it.
;
; The playable default selects level 2. See DefaultGameUserSettings.ini and
; AHKPlayerController::ApplyQuality.

; Virtual shadow maps. 0 matches the camera projection. Subtracting 1 doubles resolution
; and cost (r.Shadow.Virtual.ResolutionLodBiasDirectional). Roads are non-Nanite and the
; landscape is non-Nanite, which is the expensive part of a virtual shadow map, so High
; steps one notch coarser than the camera match. Epic and Cinematic stay on the engine curve.

[ShadowQuality@0]
r.Shadow.Virtual.ResolutionLodBiasDirectional=2

[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1

[ShadowQuality@2]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1

; Software Lumen final gather. A higher DownsampleFactor places fewer screen probes
; (Lumen Performance Guide). 32 is the engine High spacing.

[GlobalIlluminationQuality@2]
r.Lumen.ScreenProbeGather.DownsampleFactor=32

; Lumen reflections on the default quality. 2 traces one ray per 2x2 quad (Lumen Performance Guide).

[ReflectionQuality@2]
r.Lumen.Reflections.DownsampleFactor=2
